name: Liberty 4 NC - Android test APK

# Manual, Android-only build for testing on ARM64 phones.
# Debug APKs are automatically signed by the Android build tools using a
# temporary test key. They are not release builds, and updates built in
# separate runs will usually require uninstalling the previous test APK.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Android / Rust build tools
        uses: ./.github/actions/install-android-build-tools
        with:
          cache: false
          arch: arm64-v8a

      - name: Build automatically signed Android debug APK
        working-directory: android
        run: ./gradlew "assembleArm64-v8aDebug"

      - name: Check APK signature and calculate SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find android/app/build/outputs/apk -type f -name '*debug*.apk' | grep 'arm64-v8a')
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "Expected exactly one ARM64 debug APK; found ${#apks[@]}."
            exit 1
          fi

          mkdir -p build-output
          cp "${apks[0]}" build-output/OpenSCQ30-Liberty4NC-test.apk

          signer="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$signer" ]; then
            echo "Android apksigner was not found."
            exit 1
          fi
          "$signer" verify --verbose --print-certs build-output/OpenSCQ30-Liberty4NC-test.apk
          sha256sum build-output/OpenSCQ30-Liberty4NC-test.apk

      - name: Upload test APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: liberty4nc-android-test-apk
          path: build-output/OpenSCQ30-Liberty4NC-test.apk
          if-no-files-found: error
