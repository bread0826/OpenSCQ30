name: Studio White demo verification

on:
  workflow_dispatch:
  push:
    branches:
      - codex/studio-white
    paths:
      - .github/workflows/studio-white-demo.yml
      - android/**

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/install-android-build-tools
        with:
          cache: true
          arch: x86_64

      - name: Install emulator system image
        run: |
          tools="$ANDROID_HOME/cmdline-tools/latest/bin"
          if [ ! -x "$tools/sdkmanager" ]; then
            manager="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
            tools="$(dirname "${manager:?Android SDK manager was not found}")"
          fi
          echo "$tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          "$tools/sdkmanager" "platform-tools" "emulator" "system-images;android-36;google_apis;x86_64"

      - name: Start Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-openscq30-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          echo no | avdmanager create avd --force --name studio-white --package "system-images;android-36;google_apis;x86_64"
          nohup "$ANDROID_HOME/emulator/emulator" -avd studio-white -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect >"$RUNNER_TEMP/emulator.log" 2>&1 </dev/null &
          timeout 180 adb wait-for-device || { cat "$RUNNER_TEMP/emulator.log"; exit 1; }
          timeout 180 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = 1 ]; do sleep 3; done'
          adb shell wm size 900x1920
          adb shell wm density 360
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm dismiss-keyguard

      - name: Verify Liberty 4 NC demo and capture both themes
        working-directory: android
        run: |
          ./gradlew assembleX86_64Debug assembleX86_64DebugAndroidTest
          app_apk="$(find app/build/outputs/apk/x86_64/debug -name '*.apk' -type f)"
          test_apk="$(find app/build/outputs/apk/androidTest -name '*.apk' -type f)"
          adb install -g "$app_apk"
          adb install "$test_apk"
          runner="$(adb shell pm list instrumentation | sed -n 's/^instrumentation:\([^ ]*\) (target=com\.oppzippy\.openscq30\.debug).*$/\1/p')"
          mkdir -p ../studio-white-screenshots
          adb shell am instrument -w -r -e class com.oppzippy.openscq30.StudioWhiteDemoTest "$runner" \
            | tee ../studio-white-screenshots/instrumentation.log
          grep -Eq '^OK \([1-9][0-9]* tests?\)' ../studio-white-screenshots/instrumentation.log

      - name: Collect screenshots
        if: always()
        run: |
          mkdir -p studio-white-screenshots
          for theme in light dark; do
            file="studio-white-$theme.png"
            if adb shell run-as com.oppzippy.openscq30.debug test -f "files/$file"; then
              adb exec-out run-as com.oppzippy.openscq30.debug cat "files/$file" >"studio-white-screenshots/$file"
            fi
          done

      - name: Upload screenshots and test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: studio-white-demo
          path: studio-white-screenshots
